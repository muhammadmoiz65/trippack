spring.application.name=TripPack

# Embedded H2 database stored in ./data so trips survive a restart. Nothing to install.
spring.datasource.url=jdbc:h2:file:./data/trippack;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Free Open-Meteo APIs, no key required.
trippack.weather.geocoding-url=https://geocoding-api.open-meteo.com/v1
trippack.weather.forecast-url=https://api.open-meteo.com/v1
trippack.weather.archive-url=https://archive-api.open-meteo.com/v1
# Open-Meteo forecasts reach 16 days ahead. Trips further away use last year's weather.
trippack.weather.forecast-days=16

# Errors are returned as JSON (RFC 9457 problem details) so the front-end can show the message.
spring.mvc.problemdetails.enabled=true
